
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Management</title>

    <link rel="stylesheet" href="../css/books.css">
    <link rel="stylesheet" href="../css/images.css">
</head>

<body>

    <img class="brand-logo page-logo" src="../images/logo.png" alt="Digital Library">
    <h2>Manage library books and their information.</h2>
    <div class="library-visual library-visual--short">
        <img src="../images/books.jpg" alt="Books and reading materials in the library">
    </div>

    <!-- Add New Book -->

    <div class="container">

        <h2 class="section-title">➕ Add New Book</h2>

        <form id="bookForm">

            <div class="form-grid">

                <div class="form-group">
                    <label>Book ID</label>
                    <input type="text" id="bookId"
                    placeholder="Enter Book ID" required>
                </div>

                <div class="form-group">
                    <label>Book Name</label>
                    <input type="text" id="bookName"
                    placeholder="Enter Book Name" required>
                </div>

                <div class="form-group">
                    <label>Author Name</label>
                    <input type="text" id="author"
                    placeholder="Enter Author Name" required>
                </div>

                <div class="form-group">
                    <label>Publisher</label>
                    <input type="text" id="publisher"
                    placeholder="Enter Publisher Name" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option>Programming</option>
                        <option>Science</option>
                        <option>Technology</option>
                        <option>Novel</option>
                        <option>History</option>
                        <option>Other</option>
                    </select>
                </div>

        

                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="quantity"
                    placeholder="Enter Book Quantity"
                    min="1" required>
                </div>

    


            <button type="submit">Add Book</button>

        </form>

    </div>

    <!-- Book Details -->

    <div class="container">

        <h2 class="section-title">📚 Book Details</h2>

        <table>
            <thead>
                <tr>
                    <th>Book ID</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Publisher</th>
                    <th>Category</th>

                    <th>Quantity</th>
                
                </tr>
            </thead>

            <tbody id="bookTable"></tbody>

        </table>

    </div>

    <script src="../javascript/books.js"></script>

</body>
</html>
